<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil - StageX Marrakech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>StageX-Marrakech</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="offres.html">Offres</a>
            <a href="dashboard.html">Mon espace</a>
            <a href="favoris.html">Mes favoris</a>
            <button type="button" onclick="logout()">Déconnexion</button>
        </nav>
    </header>

    <main class="dashboard">
        <h1>Mon profil étudiant</h1>
        <div id="profilMessage"></div>

        <form id="profilForm">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" required>

            <label for="nom">Nom</label>
            <input type="text" id="nom" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <button type="submit" class="btn-primary">
                Enregistrer les modifications
            </button>
        </form>

        <hr>

        <h2>Mon CV</h2>
        <p>Format PDF uniquement, maximum 5 Mo.</p>

        <form id="cvForm">
            <label for="cv">Choisir mon CV (PDF)</label>
            <input type="file" id="cv" accept="application/pdf,.pdf" required>

            <button type="submit" class="btn-primary">Envoyer mon CV</button>
        </form>

        <button type="button" id="btnTelechargerCV" class="btn-primary">
            Télécharger mon CV
        </button>

        <p id="cvMessage"></p>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/profil.js"></script>
</body>
</html>
